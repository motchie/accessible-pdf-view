<!doctype html>
<!-- The base language, replaced with the interface language by
     /document-language.js before the body is parsed: a `lang` changed any
     later is not passed on to screen readers by Firefox (#40). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- First, and not a module: it has to run before the body exists. -->
    <script src="/document-language.js"></script>
    <!-- No `user-scalable=no` and no `maximum-scale`: pinch zoom and browser
         zoom must both keep working. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessible PDF View</title>
    <meta name="description" content="Read PDFs as accessible, structured HTML." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
