<!doctype html>
<!-- The base language. `main.tsx` replaces it with the interface language
     before React starts, while the page is still loading: a page that says
     `lang="en"` while showing Japanese is read aloud as English, and a `lang`
     changed after load is not picked up by the screen reader (#40). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- No `user-scalable=no` and no `maximum-scale`: pinch zoom and browser
         zoom must both keep working. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Accessible PDF View</title>
    <meta name="description" content="Read PDFs as accessible, structured HTML." />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
