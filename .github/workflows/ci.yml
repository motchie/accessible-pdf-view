# Type-checks, tests and builds every pull request and every push to main.
#
# The same steps as the build job in release.yml, short of the zip: a pull
# request should fail here, where it can be fixed, rather than at a release tag.
#
# Only the published suites run. The suites that need the private fixtures live
# outside this repository, and vitest.config.ts's glob matches nothing without
# them — so a change that touches reading real documents still wants a local run
# with them present.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # A new push to a pull request supersedes the run before it; runs on main
  # each finish, so every commit there has a result.
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci
      - run: npm run compile
      - run: npm test
      - run: npm run build
